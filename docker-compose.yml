services:
  # 1. PostgreSQL Database Container
  postgres-db:
    image: postgres:15-alpine
    container_name: subsentry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subsentry_db
      POSTGRES_USER: subsentry_user
      POSTGRES_PASSWORD: secure_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsentry_user -d subsentry_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - subsentry-net

  # 2. REST API Ingestion & Query Backend Container (Port 5000)
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subsentry_api
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://subsentry_user:secure_password_here@postgres-db:5432/subsentry_db
    ports:
      - "5000:5000"
    volumes:
      - ./backend/server.js:/app/server.js
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - subsentry-net

  # 3. React SCADA Web Dashboard & Nginx Reverse Proxy (Port 80)
  frontend-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subsentry_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
    networks:
      - subsentry-net

volumes:
  postgres_data:
    driver: local

networks:
  subsentry-net:
    driver: bridge
